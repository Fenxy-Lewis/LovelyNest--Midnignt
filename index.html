        });
    }

    function setText(id, value) {
      const element = document.getElementById(id);
      if (element) element.textContent = value;
    }

    function applyWebsiteConfig() {
      document.title = `${CONFIG.websiteName} — Featured Videos`;

      setText('nav-brand', CONFIG.websiteName);
      setText('website-name', CONFIG.websiteName);
      setText('hero-status', CONFIG.heroStatus);
      setText('website-description', CONFIG.websiteDescription);

      setText('section-label', CONFIG.section.label);
      setText('section-title', CONFIG.section.title);
      setText('section-description', CONFIG.section.description);

      setText('cta-title', CONFIG.cta.title);
      setText('cta-description', CONFIG.cta.description);
      setText('cta-button', CONFIG.cta.button);

      setText('footer-name', CONFIG.websiteName);
      setText('footer-description', CONFIG.footer.description);
      setText('copyright', `© ${new Date().getFullYear()} ${CONFIG.websiteName}.`);
      setText('footer-credit', CONFIG.footer.credit);

      const profile = document.getElementById('profile-image');
      if (profile) {
        profile.src = CONFIG.profileImage;
        profile.onerror = function () {
          // Fallback to IMG/2.jpg or icon if PF.jpg fails
          if (!this.getAttribute('data-fallback-tried')) {
            this.setAttribute('data-fallback-tried', 'true');
            this.src = 'IMG/2.jpg';
          } else {
            this.style.display = 'none';
            if (this.parentElement) {
              this.parentElement.innerHTML = `
      <span class="w-full h-full flex items-center justify-center text-purple-600 bg-purple-50">
        <i data-lucide="user" class="h-10 w-10"></i>
      </span>`;
              refreshIcons();
            }
          }
        };
      }
    }

    function renderFilterPills() {
      const filterContainer = document.getElementById('filter-container');
      if (!filterContainer) return;

      const tags = ['All', ...new Set(VIDEOS.map(v => v.tag))];

      filterContainer.innerHTML = tags.map(tag => `
      <button
        class="filter-btn text-xs font-semibold px-3.5 py-1.5 rounded-sm border border-slate-200 bg-white text-slate-600 shadow-sm hover:border-purple-300 hover:text-purple-600 ${tag === activeFilter ? 'active' : ''}"
        data-tag="${escapeHTML(tag)}">
        ${escapeHTML(tag)}
      </button>
      `).join('');

      filterContainer.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeFilter = btn.getAttribute('data-tag');
          renderFilterPills();
          filterAndRenderVideos();
        });
      });
    }

    function videoCard(video) {
      const title = escapeHTML(video.title);
      const duration = escapeHTML(video.duration);
      const views = escapeHTML(video.views);
      const image = escapeHTML(video.image);
      const tag = escapeHTML(video.tag);

      return `
      <article
        class="video-card glass rounded-md overflow-hidden shadow-sm flex flex-col justify-between border border-slate-200/80 bg-white">
        <div class="relative aspect-video bg-slate-900 overflow-hidden group">
          <img src="${image}" alt="${title}"
            class="video-thumb w-full h-full object-cover transition duration-500 ease-out" loading="lazy"
            onerror="this.src='IMG/1.jpg'" />

          <div class="absolute inset-0 bg-black/10 pointer-events-none">
          </div>

          <!-- Top Badges -->
          <div class="absolute top-3 left-3 right-3 flex items-center justify-between pointer-events-none">
            <span
              class="rounded-md bg-white/95 text-slate-900 px-2 py-0.5 text-[10px] font-bold shadow-sm backdrop-blur-sm">
              ${tag}
            </span>
            <span
              class="rounded-md bg-black/60 text-white border border-white/20 px-1.5 py-0.5 text-[9px] font-bold tracking-wider uppercase">
              1080P HD
            </span>
          </div>

          <!-- Play Button Overlay -->
          <a data-smartlink href="${CONFIG.smartlink}" class="absolute inset-0 flex items-center justify-center"
            aria-label="Play ${title}">
            <span
              class="h-12 w-12 sm:h-14 sm:w-14 rounded-md bg-white/95 text-purple-600 flex items-center justify-center shadow-sm group-hover:scale-110 group-hover:bg-purple-600 group-hover:text-white transition duration-300">
              <i data-lucide="play" class="h-5 w-5 sm:h-6 sm:w-6 ml-0.5 fill-current"></i>
            </span>
          </a>

          <!-- Duration Badge -->
          <span
            class="absolute bottom-2.5 right-2.5 rounded-md bg-black/80 text-white font-medium px-2 py-0.5 text-[11px] backdrop-blur-sm">
            ${duration}
          </span>
        </div>

        <div class="p-4 sm:p-5 flex-1 flex flex-col justify-between">
          <h3
            class="font-bold text-slate-800 text-sm sm:text-[15px] leading-snug line-clamp-2 hover:text-purple-600 transition">
            <a data-smartlink href="${CONFIG.smartlink}">${title}</a>
          </h3>

          <div class="flex items-center justify-between gap-2 mt-4 pt-3 border-t border-slate-100">
            <span class="text-[11px] text-slate-500 inline-flex items-center gap-1 font-medium">
              <i data-lucide="eye" class="h-3.5 w-3.5 text-slate-400"></i>
              ${views} views
            </span>

            <a data-smartlink href="${CONFIG.smartlink}"
              class="primary-btn inline-flex items-center gap-1.5 rounded-sm text-white px-3 py-1.5 text-xs font-semibold">
              <i data-lucide="play" class="h-3 w-3 fill-current"></i>
              Watch Now
            </a>
          </div>
        </div>
      </article>
      `;
    }

    function filterAndRenderVideos() {
      const grid = document.getElementById('video-grid');
      const noVideos = document.getElementById('no-videos');
      if (!grid) return;

      const filtered = VIDEOS.filter(v => {
        const matchesTag = activeFilter === 'All' || v.tag.toLowerCase() === activeFilter.toLowerCase();
        const matchesSearch = !searchQuery ||
          v.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
          v.tag.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesTag && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '';
        if (noVideos) noVideos.classList.remove('hidden');
      } else {
        if (noVideos) noVideos.classList.add('hidden');
        grid.innerHTML = filtered.map(videoCard).join('');
      }

      setupSmartlinks();
      refreshIcons();
    }

    function setupSmartlinks() {
      document.querySelectorAll('[data-smartlink]').forEach(element => {
        element.href = CONFIG.smartlink;
        element.target = '_blank';
        element.rel = 'nofollow sponsored noopener';
      });
    }

    // Safely render Adsterra iframe banners in sandboxed scope so scripts execute properly
    function createAdIframe(code, width, height) {
      const iframe = document.createElement('iframe');
      iframe.style.width = width + 'px';
      iframe.style.height = height + 'px';
      iframe.style.border = 'none';
      iframe.style.overflow = 'hidden';
      iframe.setAttribute('scrolling', 'no');
      iframe.setAttribute('frameborder', '0');

      const html = `
      <!DOCTYPE html>
      <html>

      <head>
        <meta charset="utf-8">
        <style>
          * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
          }

          html,
          body {
            width: 100%;
            height: 100%;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
          }
        </style>
      </head>

      <body>
        ${code}
      </body>

      </html>`;

      iframe.srcdoc = html;
      return iframe;
    }

    function renderAdSlot(slotId, slotConfig) {
      const container = document.getElementById(slotId);
      if (!container || !slotConfig || !slotConfig.enabled) return;

      container.innerHTML = '';

      const wrapper = document.createElement('div');
      wrapper.className = 'w-full flex flex-col items-center justify-center my-2';

      // Mobile Slot
      if (slotConfig.mobile && slotConfig.mobile.code && !slotConfig.mobile.code.includes('PASTE_MOBILE')) {
        const mobileBox = document.createElement('div');
        mobileBox.className = 'block sm:hidden my-1 rounded-xl overflow-hidden shadow-sm border border-slate-200/80 bg-white';
        mobileBox.style.width = slotConfig.mobile.width + 'px';
        mobileBox.style.height = slotConfig.mobile.height + 'px';

        const iframeMobile = createAdIframe(slotConfig.mobile.code, slotConfig.mobile.width, slotConfig.mobile.height);
        mobileBox.appendChild(iframeMobile);
        wrapper.appendChild(mobileBox);
      }

      // Desktop Slot
      if (slotConfig.desktop && slotConfig.desktop.code && !slotConfig.desktop.code.includes('PASTE_DESKTOP')) {
        const desktopBox = document.createElement('div');
        desktopBox.className = 'hidden sm:block my-1 rounded-xl overflow-hidden shadow-sm border border-slate-200/80 bg-white';
        desktopBox.style.width = slotConfig.desktop.width + 'px';
        desktopBox.style.height = slotConfig.desktop.height + 'px';

        const iframeDesktop = createAdIframe(slotConfig.desktop.code, slotConfig.desktop.width,
          slotConfig.desktop.height);
        desktopBox.appendChild(iframeDesktop);
        wrapper.appendChild(desktopBox);
      }

      container.appendChild(wrapper);
    }

    function renderAds() {
      renderAdSlot('ad-top', CONFIG.ads.top);
      renderAdSlot('ad-mid', CONFIG.ads.mid);
    }

    function refreshIcons() {
      if (window.lucide) {
        lucide.createIcons();
      }
    }

    function setupSearch() {
      const searchInput = document.getElementById('video-search');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          searchQuery = e.target.value.trim();
          filterAndRenderVideos();
        });
      }

      const resetBtn = document.getElementById('reset-filter-btn');
      if (resetBtn) {
        resetBtn.addEventListener('click', () => {
          activeFilter = 'All';
          searchQuery = '';
          if (searchInput) searchInput.value = '';
          renderFilterPills();
          filterAndRenderVideos();
        });
      }
    }

    function injectStructuredData() {
      const baseUrl = window.location.origin + window.location.pathname;
      const videoObjects = VIDEOS.map(v => {
        const parts = v.duration.split(':');
        let durationIso = 'PT';
        if (parts.length === 2) {
          durationIso += parts[0] + 'M' + parts[1] + 'S';
        } else if (parts.length === 3) {
          durationIso += parts[0] + 'H' + parts[1] + 'M' + parts[2] + 'S';
        }

        return {
          "@context": "https://schema.org",
          "@type": "VideoObject",
          "name": v.title,
          "description": v.title,
          "thumbnailUrl": [new URL(v.image, baseUrl).href],
          "duration": durationIso,
          "contentUrl": CONFIG.smartlink
        };
      });

      const script = document.createElement('script');
      script.type = 'application/ld+json';
      script.text = JSON.stringify(videoObjects);
      document.head.appendChild(script);
    }

    function init() {
      applyTheme();
      applyWebsiteConfig();
      renderFilterPills();
      filterAndRenderVideos();
      setupSmartlinks();
      renderAds();
      setupSearch();
      refreshIcons();
      injectStructuredData();
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>

</body>
